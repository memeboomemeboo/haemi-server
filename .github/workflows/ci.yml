name: Spring Boot Test

on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run S1 safety regression gate
        run: ./gradlew test --tests com.memeboo2.haemi.regression.S1RegressionSuiteTest --no-daemon

      - name: Verify production configuration wiring
        run: ./gradlew test --tests com.memeboo2.haemi.DeploymentConfigurationTest --tests com.memeboo2.haemi.DatabaseConfigurationTest --no-daemon
