name: Docker Compose CI/CD (Production)

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_IMAGE }}:${IMAGE_TAG} \
            -t ${{ secrets.DOCKER_IMAGE }}:latest \
            --push \
            .

      - name: Sync Compose manifest to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "compose.yaml"
          target: /home/${{ secrets.EC2_USERNAME }}/haemi
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ELDER_HEALTH_ENCRYPTION_KEY: ${{ secrets.ELDER_HEALTH_ENCRYPTION_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          INSTITUTION_ADMIN_EMAILS: ${{ secrets.INSTITUTION_ADMIN_EMAILS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: ELDER_HEALTH_ENCRYPTION_KEY,POSTGRES_PASSWORD,JWT_SECRET,GEMINI_API_KEY,GEMINI_MODEL,FIREBASE_CREDENTIALS,FIREBASE_PROJECT_ID,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,MAIL_FROM,APP_PUBLIC_URL,INSTITUTION_ADMIN_EMAILS
          command_timeout: 10m
          script: |
            set -eu
            cd ~/haemi

            save_env() {
              name="$1"
              value="$2"
              temporary_env="$(mktemp)"
              if [ -f .env ]; then
                grep -v "^${name}=" .env > "$temporary_env" || true
              fi
              printf '%s=%s\n' "$name" "$value" >> "$temporary_env"
              chmod 600 "$temporary_env"
              mv "$temporary_env" .env
            }

            test -n "$ELDER_HEALTH_ENCRYPTION_KEY" || {
              echo "ELDER_HEALTH_ENCRYPTION_KEY GitHub Secret이 필요합니다." >&2
              exit 1
            }
            save_env ELDER_HEALTH_ENCRYPTION_KEY "$ELDER_HEALTH_ENCRYPTION_KEY"
            test -n "$POSTGRES_PASSWORD" || {
              echo "POSTGRES_PASSWORD GitHub Secret이 필요합니다." >&2
              exit 1
            }
            save_env POSTGRES_PASSWORD "$POSTGRES_PASSWORD"
            test -n "$JWT_SECRET" || {
              echo "JWT_SECRET GitHub Secret이 필요합니다." >&2
              exit 1
            }
            save_env JWT_SECRET "$JWT_SECRET"
            save_env GEMINI_API_KEY "$GEMINI_API_KEY"
            save_env GEMINI_MODEL "$GEMINI_MODEL"

            # 서비스 계정 JSON은 .env에 넣지 않는다. 여러 줄로 저장된 Secret이 들어오면
            # printf 한 줄 쓰기가 깨지면서 뒤따르는 항목까지 오염된다. 파일로 분리한다.
            mkdir -p secrets
            chmod 700 secrets
            test -n "${FIREBASE_CREDENTIALS:-}" || {
              echo "FIREBASE_CREDENTIALS GitHub Secret이 필요합니다." >&2
              exit 1
            }
            printf '%s' "$FIREBASE_CREDENTIALS" > secrets/firebase-service-account.json
            chmod 600 secrets/firebase-service-account.json
            save_env FIREBASE_CREDENTIALS /run/secrets/firebase-service-account.json
            test -n "${FIREBASE_PROJECT_ID:-}" || {
              echo "FIREBASE_PROJECT_ID GitHub Secret이 필요합니다." >&2
              exit 1
            }
            save_env FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"

            test -n "${MAIL_HOST:-}" || { echo "MAIL_HOST GitHub Secret이 필요합니다." >&2; exit 1; }
            save_env MAIL_HOST "$MAIL_HOST"
            test -n "${MAIL_PORT:-}" || { echo "MAIL_PORT GitHub Secret이 필요합니다." >&2; exit 1; }
            save_env MAIL_PORT "$MAIL_PORT"
            test -n "${MAIL_USERNAME:-}" || { echo "MAIL_USERNAME GitHub Secret이 필요합니다." >&2; exit 1; }
            save_env MAIL_USERNAME "$MAIL_USERNAME"
            test -n "${MAIL_PASSWORD:-}" || { echo "MAIL_PASSWORD GitHub Secret이 필요합니다." >&2; exit 1; }
            save_env MAIL_PASSWORD "$MAIL_PASSWORD"
            test -n "${MAIL_FROM:-}" || { echo "MAIL_FROM GitHub Secret이 필요합니다." >&2; exit 1; }
            save_env MAIL_FROM "$MAIL_FROM"
            test -n "${APP_PUBLIC_URL:-}" || { echo "APP_PUBLIC_URL GitHub Secret이 필요합니다." >&2; exit 1; }
            save_env APP_PUBLIC_URL "$APP_PUBLIC_URL"

            # 비우면 아무도 기관 관리자로 가입할 수 없다. 그게 안전한 기본값이다.
            save_env INSTITUTION_ADMIN_EMAILS "${INSTITUTION_ADMIN_EMAILS:-}"

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env
            else
              echo 'IMAGE_TAG=${{ github.sha }}' >> .env
            fi

            APP_PORT_VALUE="$(grep -E '^APP_PORT=' .env | tail -n 1 | cut -d= -f2-)"
            APP_PORT_VALUE="${APP_PORT_VALUE:-8080}"
            OPENAPI_SERVER_URL_VALUE="http://${{ secrets.EC2_HOST }}:${APP_PORT_VALUE}"
            if grep -q '^OPENAPI_SERVER_URL=' .env; then
              sed -i "s#^OPENAPI_SERVER_URL=.*#OPENAPI_SERVER_URL=${OPENAPI_SERVER_URL_VALUE}#" .env
            else
              echo "OPENAPI_SERVER_URL=${OPENAPI_SERVER_URL_VALUE}" >> .env
            fi

            docker compose pull app
            docker compose up -d

            health_url="http://127.0.0.1:${APP_PORT_VALUE}/actuator/health"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 "$health_url"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker compose logs --tail=200 app
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
