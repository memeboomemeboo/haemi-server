name: Docker Compose CI/CD (Production)

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_IMAGE }}:${IMAGE_TAG} \
            -t ${{ secrets.DOCKER_IMAGE }}:latest \
            --push \
            .

      - name: Sync Compose manifest to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "compose.yaml"
          target: /home/${{ secrets.EC2_USERNAME }}/haemi
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ELDER_HEALTH_ENCRYPTION_KEY: ${{ secrets.ELDER_HEALTH_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: ELDER_HEALTH_ENCRYPTION_KEY,GEMINI_API_KEY,GEMINI_MODEL
          command_timeout: 10m
          script: |
            set -eu
            cd ~/haemi

            save_env() {
              name="$1"
              value="$2"
              temporary_env="$(mktemp)"
              if [ -f .env ]; then
                grep -v "^${name}=" .env > "$temporary_env" || true
              fi
              printf '%s=%s\n' "$name" "$value" >> "$temporary_env"
              chmod 600 "$temporary_env"
              mv "$temporary_env" .env
            }

            test -n "$ELDER_HEALTH_ENCRYPTION_KEY" || {
              echo "ELDER_HEALTH_ENCRYPTION_KEY GitHub Secret이 필요합니다." >&2
              exit 1
            }
            save_env ELDER_HEALTH_ENCRYPTION_KEY "$ELDER_HEALTH_ENCRYPTION_KEY"
            save_env GEMINI_API_KEY "$GEMINI_API_KEY"
            save_env GEMINI_MODEL "$GEMINI_MODEL"

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env
            else
              echo 'IMAGE_TAG=${{ github.sha }}' >> .env
            fi

            APP_PORT_VALUE="$(grep -E '^APP_PORT=' .env | tail -n 1 | cut -d= -f2-)"
            APP_PORT_VALUE="${APP_PORT_VALUE:-8080}"
            OPENAPI_SERVER_URL_VALUE="http://${{ secrets.EC2_HOST }}:${APP_PORT_VALUE}"
            if grep -q '^OPENAPI_SERVER_URL=' .env; then
              sed -i "s#^OPENAPI_SERVER_URL=.*#OPENAPI_SERVER_URL=${OPENAPI_SERVER_URL_VALUE}#" .env
            else
              echo "OPENAPI_SERVER_URL=${OPENAPI_SERVER_URL_VALUE}" >> .env
            fi

            docker compose pull app
            docker compose up -d

            health_url="http://127.0.0.1:${APP_PORT_VALUE}/actuator/health"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 "$health_url"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker compose logs --tail=200 app
                exit 1
              fi
              sleep 2
            done

            docker image prune -f
