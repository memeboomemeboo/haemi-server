<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해미 FCM 토큰 테스터</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
         max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.05rem; margin-top: 2rem; }
  fieldset { border: 1px solid rgba(128,128,128,.4); border-radius: 8px; padding: 1rem; margin: 0 0 1rem; }
  label { display: block; font-size: .82rem; opacity: .8; margin-top: .6rem; }
  input, textarea { width: 100%; padding: .45rem .6rem; font: inherit; font-size: .9rem;
                    border: 1px solid rgba(128,128,128,.5); border-radius: 6px; background: transparent; color: inherit; }
  button { font: inherit; padding: .5rem 1rem; border-radius: 6px; border: 1px solid rgba(128,128,128,.5);
           background: transparent; color: inherit; cursor: pointer; margin-top: .8rem; }
  button:hover { background: rgba(128,128,128,.12); }
  pre { background: rgba(128,128,128,.12); padding: .8rem; border-radius: 6px; overflow-x: auto; font-size: .82rem; }
  .token { word-break: break-all; font-size: .8rem; }
  .hint { font-size: .85rem; opacity: .75; }
</style>
</head>
<body>
<h1>해미 FCM 토큰 테스터</h1>
<p class="hint">
  클라이언트 앱이 없을 때 실제 FCM 등록 토큰을 발급받아 서버에 등록하고, 알림이 실제로 도착하는지 확인하는 용도예요.
  입력한 값은 이 브라우저의 localStorage에만 저장되고 어디에도 전송되지 않아요.
</p>

<h2>1. Firebase 웹 앱 설정</h2>
<p class="hint">Firebase 콘솔 → 프로젝트 설정 → 일반 → 내 앱(웹)에서 복사하세요. VAPID 키는 클라우드 메시징 탭의 "웹 푸시 인증서"에 있어요.</p>
<fieldset>
  <label>apiKey <input id="apiKey" autocomplete="off"></label>
  <label>projectId <input id="projectId" autocomplete="off"></label>
  <label>messagingSenderId <input id="messagingSenderId" autocomplete="off"></label>
  <label>appId <input id="appId" autocomplete="off"></label>
  <label>VAPID 키 <input id="vapidKey" autocomplete="off"></label>
  <button id="getToken">토큰 발급받기</button>
</fieldset>
<div id="tokenBox"></div>

<h2>2. 서버에 토큰 등록</h2>
<fieldset>
  <label>서버 주소 <input id="serverUrl" value="http://localhost:8080" autocomplete="off"></label>
  <label>액세스 토큰 (JWT) <input id="jwt" autocomplete="off" placeholder="로그인 응답의 accessToken"></label>
  <button id="register">POST /api/v1/device-tokens</button>
  <button id="testSend">테스트 발송 (dev 전용)</button>
</fieldset>

<h2>결과</h2>
<pre id="log">대기 중…</pre>

<h2>수신한 알림 (포그라운드)</h2>
<pre id="messages">아직 없어요.</pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";

const FIELDS = ["apiKey", "projectId", "messagingSenderId", "appId", "vapidKey", "serverUrl", "jwt"];
const $ = (id) => document.getElementById(id);
const logEl = $("log");
let fcmToken = localStorage.getItem("haemi.fcmToken") || "";

const log = (label, value) => {
  logEl.textContent = `[${new Date().toLocaleTimeString()}] ${label}\n` +
    (typeof value === "string" ? value : JSON.stringify(value, null, 2));
};

// 입력값 복원/보존 — 브라우저 밖으로 나가지 않는다.
FIELDS.forEach((id) => {
  const saved = localStorage.getItem("haemi." + id);
  if (saved) $(id).value = saved;
  $(id).addEventListener("input", () => localStorage.setItem("haemi." + id, $(id).value));
});

const renderToken = () => {
  $("tokenBox").innerHTML = fcmToken
    ? `<p class="hint">발급된 토큰:</p><pre class="token">${fcmToken}</pre>`
    : "";
};
renderToken();

$("getToken").addEventListener("click", async () => {
  try {
    const config = {
      apiKey: $("apiKey").value.trim(),
      projectId: $("projectId").value.trim(),
      messagingSenderId: $("messagingSenderId").value.trim(),
      appId: $("appId").value.trim(),
    };
    if (Object.values(config).some((v) => !v)) return log("설정 누락", "네 항목을 모두 채워주세요.");

    const permission = await Notification.requestPermission();
    if (permission !== "granted") return log("권한 거부", "브라우저 알림 권한을 허용해야 토큰을 받을 수 있어요.");

    // 서비스 워커에도 같은 설정이 필요해서 쿼리로 넘긴다.
    const swUrl = "./firebase-messaging-sw.js?" + new URLSearchParams(config).toString();
    const registration = await navigator.serviceWorker.register(swUrl, { type: "module" });

    const messaging = getMessaging(initializeApp(config));
    fcmToken = await getToken(messaging, {
      vapidKey: $("vapidKey").value.trim(),
      serviceWorkerRegistration: registration,
    });
    localStorage.setItem("haemi.fcmToken", fcmToken);
    renderToken();
    log("토큰 발급 성공", fcmToken);

    onMessage(messaging, (payload) => {
      $("messages").textContent =
        `[${new Date().toLocaleTimeString()}] ` + JSON.stringify(payload.notification ?? payload, null, 2)
        + "\n\n" + $("messages").textContent;
    });
  } catch (e) {
    log("토큰 발급 실패", String(e));
  }
});

const call = async (path, body) => {
  const response = await fetch($("serverUrl").value.trim() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + $("jwt").value.trim() },
    body: JSON.stringify(body),
  });
  const text = await response.text();
  log(`${path} → ${response.status}`, text);
};

$("register").addEventListener("click", () => {
  if (!fcmToken) return log("토큰 없음", "먼저 토큰을 발급받으세요.");
  call("/api/v1/device-tokens", { token: fcmToken, platform: "WEB" }).catch((e) => log("요청 실패", String(e)));
});

$("testSend").addEventListener("click", () => {
  call("/api/v1/device-tokens/test-send", {
    title: "해미 테스트 알림",
    body: "이 알림이 보이면 FCM 연동이 끝난 거예요 🎉",
  }).catch((e) => log("요청 실패", String(e)));
});
</script>
</body>
</html>
