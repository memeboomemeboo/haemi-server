spring:
  application:
    name: haemi
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haemi}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:haemi}
    password: ${DB_PASSWORD:haemi-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

haemi:
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
    local-server-url: ${OPENAPI_LOCAL_SERVER_URL:http://localhost:8080}
    include-local-server: ${OPENAPI_INCLUDE_LOCAL_SERVER:true}
  storage:
    upload-path: ${java.io.tmpdir}/haemi/photos
  album:
    max-group-members: 10
    max-photos-per-upload: 30
    max-photo-size-mb: 20
    min-photos-for-ai: 20
    sync-low-battery-threshold: 20
  ai:
    rotation-days: 7
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
  notification:
    elder-daily-limit: 3
    elder-quiet-hours-start: 21
    elder-quiet-hours-end: 8
  predownload:
    # 배치 순서: 08:00 콘텐츠 → 08:45 선다운로드 → 09:00 알림
    cron: "0 45 8 * * *"
    time-zone: Asia/Seoul
  offline:
    # 오프라인 결과 로컬 큐 보관 정책
    retention-days: 7
    cleanup-cron: "0 0 4 * * *"
    time-zone: Asia/Seoul
  elder:
    bereavement:
      # 사별 확정 후 무음기간 / 오등록 복구 허용 시간
      silent-days: 7
      recovery-window-hours: 48
  eventlog:
    # 06:00 일일 이벤트 집계
    aggregate-cron: "0 0 6 * * *"
    time-zone: Asia/Seoul
  jwt:
    secret: ${JWT_SECRET:haemi-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256!!}
    access-token-validity: PT30M
    refresh-token-validity: P14D
  security:
    # 개발 환경용 키. 운영 프로필은 ELDER_HEALTH_ENCRYPTION_KEY 없이는 기동하지 않는다.
    elder-health-encryption-key: ${ELDER_HEALTH_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
