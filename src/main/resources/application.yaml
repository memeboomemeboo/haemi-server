spring:
  application:
    name: haemi
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/haemi}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:haemi}
    password: ${DB_PASSWORD:haemi-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

haemi:
  openapi:
    server-url: ${OPENAPI_SERVER_URL:}
    local-server-url: ${OPENAPI_LOCAL_SERVER_URL:http://localhost:8080}
    include-local-server: ${OPENAPI_INCLUDE_LOCAL_SERVER:true}
  storage:
    upload-path: ${java.io.tmpdir}/haemi/photos
  album:
    max-group-members: 10
    max-photos-per-upload: 30
    max-photo-size-mb: 20
    min-photos-for-ai: 5
  ai:
    rotation-days: 7
  notification:
    elder-daily-limit: 5
  jwt:
    secret: ${JWT_SECRET:haemi-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256!!}
    access-token-validity: PT30M
    refresh-token-validity: P14D
